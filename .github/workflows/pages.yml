name: Refresh ideas & deploy

on:
  schedule:
    # Saturday 06:17 Australia/Sydney. Deliberately off the top of the hour:
    # GitHub delays — and can drop — scheduled runs under high load, and the
    # start of every hour is the busiest window.
    - cron: "17 6 * * 6"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Fetch latest issues
        run: ./fetch.sh

      - name: Extract ideas & validate invariant
        run: |
          set -o pipefail
          python3 extract.py | tee /tmp/extract-report.txt
          grep -q 'not exactly 3 : 0' /tmp/extract-report.txt

      - name: Build UI
        run: python3 build_ui.py

      - name: Commit & push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh ideas $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
